<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vídeos</title>
    </head>
      <body>
        <h1>Executando vídeos</h1>
        <!--
        source = fonte do vídeo, pode ser um arquivo local ou um link externo
        controls = exibe os controles do vídeo, como play, pause, volume, etc
        muted = inicia o vídeo sem som
        autoplay = inicia o vídeo automaticamente quando a página é carregada
        loop = faz o vídeo reiniciar automaticamente quando terminar
        poster= exibe uma imagem antes do vídeo ser carregado
        -->
            <video width="500" controls muted autoplay loop >
        <source src="imagens/videos/abelhas.mp4" type="video/mp4">   
        <!-- Esse segundo com formato ogg como segunda opçao -->     
         <source src="imagens/videos/abelhas.ogg" type="video/ogg">
         Seu navegador nao suporta a execuçao de vídeo.


            </video>
         
      </body>
</html>
